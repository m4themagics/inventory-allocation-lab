name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync scaffold dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test scaffold contracts
        run: uv run pytest
