[project]
name = "inventory-allocation-lab"
version = "0.1.0"
description = "Forecast-to-decision inventory allocation under demand uncertainty."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Phase 1 — M5 ingestion and forecasting.
data = [
    "lightgbm>=4.3",
    "polars>=1.0",
    "pyarrow>=16",
]
# Phases 3–5 — deterministic and scenario optimisation.
optimise = [
    "highspy>=1.7",
    "pyomo>=6.8",
]
# Extension after the main result. Batch remains the primary interface.
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
